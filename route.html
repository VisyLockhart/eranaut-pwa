  <script>
    /* 主題(D-277):在畫面出現前先套用,避免第一幀閃錯色。鍵與判斷要和 core/theme.ts 一致:
       已存 → 用它;沒存過但已有其他 eranaut. 設定(既有使用者)→ 經典;全新使用者 → 依系統配色(淺色系統用淺色,其他用深色)。 */
    try {
      var ids = { classic: '#070a14', light: '#eef4fc', dark: '#111923', notebook: '#4a5f42', cyber: '#07080d' };
      var th = null;
      try { th = JSON.parse(localStorage.getItem('eranaut.theme')); } catch (e) {}
      if (!ids[th]) {
        var other = false;
        for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf('eranaut.') === 0 && k !== 'eranaut.theme') { other = true; break; } }
        th = other ? 'classic' : (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        try { localStorage.setItem('eranaut.theme', JSON.stringify(th)); } catch (e) {}
      }
      document.documentElement.setAttribute('data-theme', th);
      /* 分頁圖示(D-280):非經典主題換成該主題的 favicon;core/theme.ts 的 applyFavicon 切換時做同一件事,屬性鍵要一致 */
      if (th !== 'classic') {
        var ics = document.querySelectorAll('link[rel="icon"]');
        for (var j = 0; j < ics.length; j++) {
          var lk = ics[j];
          lk.setAttribute('data-orig-href', lk.getAttribute('href') || '');
          lk.setAttribute('data-orig-type', lk.getAttribute('type') || '');
          lk.setAttribute('data-orig-sizes', lk.getAttribute('sizes') || '');
          lk.setAttribute('href', 'icons/fav-' + th + '.png');
          lk.setAttribute('type', 'image/png');
          lk.setAttribute('sizes', '64x64');
        }
      }
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', ids[th]);
      var fonts = { light: 'https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DotGothic16&family=Silkscreen:wght@400;700&display=swap', dark: 'https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@1,600&display=swap', notebook: 'https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&family=Caveat:wght@500;700&family=Patrick+Hand&display=swap', cyber: 'https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Chakra+Petch:wght@500;600;700&display=swap' }[th];
      if (fonts) { var fl = document.createElement('link'); fl.rel = 'stylesheet'; fl.href = fonts; fl.setAttribute('data-theme-fonts', fonts); document.head.appendChild(fl); }
      /* 主題樣式表(D-390):非經典主題的樣式不在首屏,這裡用 document.write 插入,解析器插入的 <link> 會擋住第一次繪製,不會閃經典配色;
         位置在 Angular 的主樣式表之前,層疊順序與合併前相同。core/theme-css.ts 執行中切換時做同一件事,屬性鍵要一致 */
      if (th !== 'classic') document.write('<link rel="stylesheet" href="theme.' + th + '.css" data-theme-css="' + th + '">');
    } catch (e) { document.documentElement.setAttribute('data-theme', 'classic'); }
  </script>
  <script>
    /* 介面大小(D-164):在畫面出現前先套用,避免第一幀閃一下小字。鍵與倍率要和 core/ui-scale.ts 一致 */
    try {
      var f = { medium: 1.15, large: 1.3 }[JSON.parse(localStorage.getItem('eranaut.ui-scale'))];
      if (f) {
        var r = document.documentElement;
        r.style.setProperty('--ui-scale', f);
        // 與 core/ui-scale.ts 的 viewportUnitDivisor 同一判斷:zoom 下 vh 會不會被乘上倍率(Chrome 會、Safari 不會)
        var mk = function (h) {
          var d = document.createElement('div');
          d.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:' + h + ';zoom:2;visibility:hidden';
          r.appendChild(d);
          return d;
        };
        var a = mk('100vh'), b = mk('100px');
        var ha = a.getBoundingClientRect().height, hb = b.getBoundingClientRect().height;
        r.removeChild(a); r.removeChild(b);
        var div = ha > 0 && hb > 0 && window.innerHeight > 0 && (ha / hb) * 100 / window.innerHeight <= 0.75 ? 1 : f;
        r.style.setProperty('--vu-div', div);
      }

<h1>FF14 潛水艇航線模擬器</h1>
<p>出航前先試算:在海圖上依序選航點,搭配潛艇的配件配置,算出航行時間、返航時刻、燃料消耗與經驗值。涵蓋溺沒海、灰海、翠浪海、紫礁海、賽蓮海等海域。</p>
<h2>找路線</h2>
<p>不知道該跑哪裡時,用「找路線」依想要的打撈物、航行時間等條件,列出符合的航線讓你比較。</p>
<h2>看配置夠不夠</h2>
<p>每條航線需要的探索、收集、速度、距離、恩惠,會和目前配置的數值並排,一眼看出哪一項不夠。</p>
