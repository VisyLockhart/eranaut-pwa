# 展示模式(D-168):以 demo 組態建置(假後端,無需 API),發佈到 GitHub Pages。
# 自訂網域 demo.eranaut.aequoreranos.com 於 repo Settings → Pages 設定。
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --workspace=shared --workspace=web --include-workspace-root
      - run: npm run build -w shared
      - run: npx ng build --configuration demo
        working-directory: web
      - name: SPA fallback and custom domain
        run: |
          cp web/dist/demo/browser/index.html web/dist/demo/browser/404.html
          echo "demo.eranaut.aequoreranos.com" > web/dist/demo/browser/CNAME
      - name: Link preview page for /intro
        run: node tools/make-intro-html.mjs web/dist/demo/browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/demo/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
