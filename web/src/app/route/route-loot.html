<div class="rt-loot-head">經驗 {{ point().expReward }}</div>
@for (t of tiers(); track t.key) {
  <div class="rt-tier t-{{ t.key }}" [class.locked]="t.locked">
    <span class="rt-tier-label">{{ t.label }}<em class="rt-tier-lk">@if (t.locked) {<i role="img" aria-label="未解鎖">🔒</i>}</em></span>
    <span class="rt-tier-items">{{ t.names.length ? t.names.join('、') : '—' }}</span>
    @if (t.locked) { <span class="rt-tier-lock">差 {{ t.gap }}</span> }
  </div>
}
