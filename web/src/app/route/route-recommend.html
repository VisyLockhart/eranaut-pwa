<app-route-cfg-bar [showPerf]="false" [showNew]="false" hint="結果會偏保守" />

<div class="rt-seg rt-seg-top" role="group" aria-label="推薦類型">
  <button type="button" class="rt-seg-btn" [class.active]="vm.recGoal() === 'find'" [attr.aria-pressed]="vm.recGoal() === 'find'" (click)="showFind()">找路線</button>
  <button type="button" class="rt-seg-btn" [class.active]="vm.recGoal() !== 'find'" [attr.aria-pressed]="vm.recGoal() !== 'find'" (click)="showBuild()">找配置</button>
</div>

@if (vm.recGoal() === 'find') {
  <app-route-find />
} @else if (vm.recGoal() === null) {
  <section class="rt-goal-group" aria-label="找配置">
    <div class="rt-goal-label">找配置:先選想去的航點,再找能達成的零件組合</div>
    <div class="rt-goals">
      @for (g of buildGoals; track g.id) {
        <button type="button" class="rt-goal build" [disabled]="!g.ready" (click)="open(g.id)">
          <span class="rt-goal-head"><b>{{ g.name }}</b><i>{{ g.ready ? g.tag : '即將推出' }}</i></span>
          <span class="rt-goal-desc">{{ g.desc }}</span>
        </button>
      }
    </div>
  </section>
} @else {
  <div class="rt-subhead">
    <button type="button" class="rt-link-btn" (click)="back()">‹ 目標</button>
    <b>{{ title() }}</b>
  </div>
  @if (vm.recGoal() === 'collect' || vm.recGoal() === 'favor' || vm.recGoal() === 'speed') {
    <app-route-target [goal]="$any(vm.recGoal())" />
  } @else if (vm.recGoal() === 'advanced') {
    <app-route-search (edit)="vm.setTab('config')" />
  }
}
