<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>Aequor Eranos</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a14">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eranaut">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <script>
    /* 介面大小(D-164):在畫面出現前先套用,避免第一幀閃一下小字。鍵與倍率要和 core/ui-scale.ts 一致 */
    try {
      var f = { medium: 1.15, large: 1.3 }[JSON.parse(localStorage.getItem('eranaut.ui-scale'))];
      if (f) document.documentElement.style.setProperty('--ui-scale', f);
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
